name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    env:
      # PyInstaller's PySide6 analysis phase tries to load Qt plugins.
      # Without a display this crashes; offscreen avoids the crash.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # libgl1 / libglib2.0-0: PySide6 shared libs link against these at
      # analysis time even when running offscreen.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ \
            libgl1 \
            libglib2.0-0

      - name: Set TAG variable
        run: echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      # build.sh compiles the C binary first, then drives uv + pyinstaller.
      # uv is not on the runner; build.sh installs it via its own curl installer.
      - name: Build bundle
        run: bash packaging/build.sh

      # Assemble a staging directory so the tarball has a clean top-level name.
      # Structure: aorus-fan-control/{bundle/,install.sh,*.desktop,*.policy}
      - name: Create tarball
        run: |
          TARBALL="aorus-fan-control-${TAG}-linux-x86_64.tar.gz"
          mkdir -p staging/aorus-fan-control
          cp -r dist/aorus-fan-control/. staging/aorus-fan-control/bundle
          cp packaging/install.sh           staging/aorus-fan-control/
          cp packaging/aorus-fan-control.desktop staging/aorus-fan-control/
          cp packaging/com.github.aorus-fan-control.policy staging/aorus-fan-control/
          tar -czf "$TARBALL" -C staging aorus-fan-control
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Generate SHA-256 checksum
        run: |
          sha256sum "$TARBALL" > "${TARBALL}.sha256"
          cat "${TARBALL}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
